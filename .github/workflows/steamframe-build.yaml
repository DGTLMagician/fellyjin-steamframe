name: Fellyjin / Build

on:
  push:
    branches:
      - master
      - steamframe
    paths:
      - steamframe/**
      - .github/workflows/steamframe-build.yaml
  pull_request:
    paths:
      - steamframe/**
      - .github/workflows/steamframe-build.yaml

permissions:
  contents: read

jobs:
  build:
    name: Build (linux-${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # The Steam Frame runs SteamOS on ARM64
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install libmpv
        # xvfb + Mesa let the theater shader preview test render offscreen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2 patchelf xvfb xauth libgl1-mesa-dri
      - name: Bundle libmpv
        run: steamframe/packaging/bundle-libmpv.sh
      - name: Run tests
        # A locale with a decimal comma catches regressions of libmpv's LC_NUMERIC requirement
        run: |
          sudo locale-gen nl_NL.UTF-8
          LC_ALL=nl_NL.UTF-8 xvfb-run -a ./gradlew -p steamframe test
      - name: Package
        run: ./gradlew -p steamframe packageTarball
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fellyjin-steamframe-linux-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            steamframe/build/dist/*.tar.gz
            steamframe/build/snapshots/*.png
